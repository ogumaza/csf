# SPDX-License-Identifier: MIT

# A vX.Y.Z tag publishes a release. X.Y.Z must match CMakeLists.txt, and docs/release-notes/X.Y.Z.md must hold the
# notes.
# Builds the Windows programs and foobar2000 component with clang-cl and attaches two downloads:
#   csf-X.Y.Z-win-x64.zip               csfrip and csfplay for 64-bit Windows, with README.md and the licences
#   foo_input_csf-X.Y.Z.fb2k-component  the component for 64-bit and 32-bit foobar2000: the 32-bit DLL at the top
#                                       level and the 64-bit one in x64/, with the licences
# Manual runs (Actions > Release > Run workflow) build the same files as an artifact without publishing a release, even
# when started from a tag.
# The build downloads the foobar2000 SDK from foobar2000.org (xsflib's ci/foobar2000-sdk).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Read the version and check that the tag matches and release notes exist.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - id: version
        uses: ./externals/xsflib/ci/release-version
        with:
          project: csf

  windows:
    needs: version
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2025
    strategy:
      matrix:
        include:
          - arch: x64
            package: win-x64
          - arch: Win32
            package: win32
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - uses: ./externals/xsflib/ci/release-windows
        with:
          version: ${{ needs.version.outputs.version }}
          cmake: -A ${{ matrix.arch }} -T ClangCL -DFOOBAR2000_SDK_DIR="${{ github.workspace }}/sdk"
          targets: csfrip csfplay foo_input_csf
          programs: csfrip csfplay
          files: >-
            build/Release/csfrip.exe build/Release/csfplay.exe build/plugins/foobar2000/Release/foo_input_csf.dll
          artifact: ${{ matrix.package }}
          foobar2000: true

  # zip, run on Linux, writes the names in the packages with forward slashes. foobar2000 requires forward slashes in a
  # component.
  package:
    needs: [version, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - uses: ./externals/xsflib/ci/package-player
        with:
          format: csf
          version: ${{ needs.version.outputs.version }}
          programs: csfrip csfplay
          component: foo_input_csf

      # The 32-bit build is for the component alone. 32-bit Windows is unsupported for the programs.
      - name: Leave out the 32-bit programs
        shell: bash
        run: rm dist/*-win32.zip

      - uses: ./externals/xsflib/ci/release-publish
        with:
          title: CSF
          version: ${{ needs.version.outputs.version }}
          artifact: csf-${{ needs.version.outputs.version }}
